databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: valerii
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_users_email } }
              - column: { name: full_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: role, type: varchar(32), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, defaultValueComputed: now(), constraints: { nullable: false } }
