spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - ru.itmo.ticketing.booking.common.UnauthorizedException
          - ru.itmo.ticketing.booking.common.NotFoundException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

eureka:
  client:
    enabled: false

logging:
  level:
    liquibase: warn
