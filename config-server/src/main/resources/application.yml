spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Отдельный git-репозиторий с конфигами (подмодуль configs-repo).
          # Локально читается с диска, в docker путь задаётся CONFIG_REPO_URI.
          uri: ${CONFIG_REPO_URI:file://${user.dir}/../configs-repo}
          default-label: main
          search-paths: "{application}"
          clone-on-start: true

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info
