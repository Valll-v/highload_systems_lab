spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users}
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
  liquibase:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users}
    user: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  forward-headers-strategy: framework
