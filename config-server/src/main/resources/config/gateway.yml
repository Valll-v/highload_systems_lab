spring:
  cloud:
    gateway:
      routes:
        - id: booking-service-api
          uri: lb://booking-service
          order: 0
          predicates:
            - Path=/api/bookings/**,/api/tickets/**,/api/events/*/seats,/api/events/*/sales,/api/events/*/bookings/**
        - id: user-service-api
          uri: lb://user-service
          order: 0
          predicates:
            - Path=/api/users/**
        - id: event-service-api
          uri: lb://event-service
          order: 10
          predicates:
            - Path=/api/**
        - id: event-service-docs
          uri: lb://event-service
          predicates:
            - Path=/event-service/v3/api-docs,/event-service/actuator/**
          filters:
            - RewritePath=/event-service/(?<path>.*), /$\{path}
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs,/user-service/actuator/**
          filters:
            - RewritePath=/user-service/(?<path>.*), /$\{path}
        - id: booking-service-docs
          uri: lb://booking-service
          predicates:
            - Path=/booking-service/v3/api-docs,/booking-service/actuator/**
          filters:
            - RewritePath=/booking-service/(?<path>.*), /$\{path}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: event-service
        url: /event-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: booking-service
        url: /booking-service/v3/api-docs
